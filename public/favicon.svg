<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85BB" />
      <stop offset="100%" stop-color="#FFCEE3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#021A54" flood-opacity="0.15" />
    </filter>
  </defs>  
  <!-- Rounded Base Container -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bg)" />
  
